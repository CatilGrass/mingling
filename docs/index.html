<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mìng Lìng - Macro magician in your CLI</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #0a0a0a, #1a1a1a, #0a0a0a);
                color: #ffffff;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .container {
                text-align: center;
                padding: 2rem;
            }
            h1 {
                font-size: 3rem;
                margin-bottom: 0.5rem;
                text-shadow: 0 0 20px rgba(255, 87, 34, 0.6);
                letter-spacing: 2px;
            }
            .subtitle {
                font-size: 1.2rem;
                color: #ff7043;
                margin-bottom: 2rem;
            }
            .magic-symbol {
                font-size: 4rem;
                margin-bottom: 1rem;
                animation:
                    float 3s ease-in-out infinite,
                    fadeIn 2s ease forwards;
                opacity: 0;
            }
            @keyframes float {
                0% {
                    transform: translateY(0px);
                }
                50% {
                    transform: translateY(-15px);
                }
                100% {
                    transform: translateY(0px);
                }
            }
            @keyframes fadeIn {
                0% {
                    opacity: 0;
                    transform: translateY(20px);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .name-line {
                font-weight: bold;
                font-size: 3rem;
                margin-bottom: 0.5rem;
                text-shadow: 0 0 20px rgba(255, 87, 34, 0.6);
                letter-spacing: 2px;
                opacity: 0;
                animation: fadeIn 1.5s ease 0s forwards;
            }
            .slogan-line {
                font-size: 2.2rem;
                color: #ff7043;
                margin-bottom: 2rem;
                opacity: 0;
                animation: fadeIn 1.5s ease 0.3s forwards;
            }
            .links {
                display: flex;
                gap: 1.5rem;
                justify-content: center;
                flex-wrap: wrap;
                opacity: 0;
                animation: fadeIn 1.5s ease 0.6s forwards;
            }
            .links a {
                color: #ff7043;
                text-decoration: none;
                font-size: 1.2rem;
                border: 1px solid #ff5722;
                padding: 0.6rem 1.5rem;
                border-radius: 30px;
                transition: all 0.3s ease;
            }
            .links a:hover {
                background: #ff5722;
                color: #0a0a0a;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="name-line">Mìng Lìng</div>
            <div class="slogan-line">"Macro magician in your CLI."</div>
            <div class="links">
                <a href="https://github.com/catilgrass/mingling" target="_blank"
                    >GitHub</a
                >
                <a href="examples.html">Examples</a>
                <a href="doc.html">Documentation</a>
            </div>
        </div>
    </body>
</html>
